<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matriz Studio | Fila de Ordem de Produção SENAI</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Barra de controle superior (ocultada na impressão) -->
  <header class="navbar no-print">
    <div class="logo-area">
      <h1>Matriz Studio — Produção SENAI</h1>
      <p>Gerador de Ordens de Produção (OP)</p>
    </div>
    <button id="btn-atualizar" class="btn-refresh">
      <i data-lucide="refresh-cw"></i> Atualizar Fila
    </button>
  </header>

  <!-- Container de Ordens de Produção -->
  <main class="dashboard-container">
    <div id="pedidos-container" class="pedidos-list">
      <p class="loading-msg no-print">A carregar ordens de produção...</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
